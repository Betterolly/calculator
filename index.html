<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202a38">
  <meta name="description" content="A clean, familiar business calculator with GST and calculation review.">
  <title>Business Calculator</title>
  <link rel="icon" type="image/svg+xml" href="./icons/calculator.svg">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">▦</div>
      <div class="brand-copy"><p class="eyebrow">EVERYDAY BUSINESS TOOL</p><h1>Calculator</h1></div>
      <button class="mic-toggle" id="mic-toggle" type="button" aria-pressed="false" title="Speak a calculation"><span aria-hidden="true">🎙</span><span id="mic-label">Speak</span></button>
      <button class="sound-toggle" id="voice-toggle" type="button" aria-pressed="true" title="Turn spoken button feedback off"><span class="sound-symbol" aria-hidden="true">◖</span><span id="voice-label">Voice on</span></button>
      <span class="local-tag">Local</span>
    </header>

    <section class="calculator" aria-label="Business calculator">
      <div class="display-wrap">
        <div class="display-meta"><span id="mode-label">STANDARD</span><span id="memory-indicator"></span></div>
        <div id="expression" class="expression" aria-live="polite"></div>
        <output id="display" class="display" aria-live="polite">0</output>
      </div>

      <div class="review-strip" aria-label="120 step check">
        <div class="review-buttons">
          <button class="review-key" data-action="check-prev"><span>CHECK</span><b>←</b></button>
          <button class="review-key" data-action="check-next"><span>CHECK</span><b>→</b></button>
          <button class="review-key" data-action="correct"><span>CORRECT</span><b>▤</b></button>
          <button class="review-key" data-action="replay"><span>AUTO</span><b>REPLAY</b></button>
        </div>
        <div class="step-caption">120 STEPS CHECK</div>
      </div>

      <div class="keypad" aria-label="Calculator keypad">
        <button class="key gst" data-action="gst-plus">GST +</button>
        <button class="key number" data-value="7">7</button><button class="key number" data-value="8">8</button><button class="key number" data-value="9">9</button>
        <button class="key operation" data-value="÷">÷</button><button class="key function" data-action="sqrt">√</button><button class="key power" data-action="clear">ON<br>AC</button>

        <button class="key gst" data-action="gst-minus">GST −</button>
        <button class="key number" data-value="4">4</button><button class="key number" data-value="5">5</button><button class="key number" data-value="6">6</button>
        <button class="key operation" data-value="×">×</button><button class="key function" data-action="percent">%</button><button class="key memory" data-action="memory-recall">Mᴿᶜ</button>

        <button class="key gst" data-action="rate">RATE</button>
        <button class="key number" data-value="1">1</button><button class="key number" data-value="2">2</button><button class="key number" data-value="3">3</button>
        <button class="key operation" data-value="+">+</button><button class="key operation" data-value="−">−</button><button class="key memory" data-action="memory-minus">M−</button>

        <button class="key sign" data-action="sign">+/−</button>
        <button class="key number bottom-number" data-value="0">0</button><button class="key number bottom-number" data-value="00">00</button><button class="key number bottom-number" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button><button class="key memory bottom-memory" data-action="memory-plus">M+</button>

        <button class="key clear-entry" data-action="clear-entry">CE</button>
      </div>
      <p id="status" class="status" role="status">Ready</p>
    </section>
    <footer>Calculations stay in this browser on this device.</footer>
  </main>
  <script src="./script.js"></script>
</body>
</html>
